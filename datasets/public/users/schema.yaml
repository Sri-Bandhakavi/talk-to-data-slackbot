  table: users
description: 'User signup and acquisition dataset.

  Business rules and semantics: - Each row represents a unique user. - signup_date
  is the primary date field for signup trend analysis. - country represents the user''s
  signup region. - device_type represents the signup platform.'
columns:
- name: user_id
  type: integer
  description: Unique identifier for the user
- name: signup_date
  type: datetime
  description: Date and time when the user signed up
- name: country
  type: string
  description: User country based on signup information (groupable dimension)
  alias: region
- name: device_type
  type: string
  description: Device type used at signup (groupable dimension)
  alias: platform
