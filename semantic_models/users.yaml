name: users

source:
  type: postgres
  table: users
  connection:
    host: localhost
    port: 5432
    user: test
    password: test
    database: testdb

description: >
  User signup and acquisition dataset.

  Business rules and semantics:
  - Each row represents a unique user.
  - signup_date is the primary date field for signup trend analysis.
  - country represents the user's signup region.
  - device_type represents the signup platform.

  Common business questions:
  - User signup trends
  - User growth over time
  - Users by region
  - Users by signup platform
  - Revenue by region
  - Revenue by signup platform

  This dataset is commonly joined to:
  - subscriptions via user_id
  - sessions via user_id

columns:

  - name: user_id
    type: integer
    description: Unique identifier for the user

  - name: signup_date
    type: datetime
    description: >
      Date and time when the user signed up.

      Primary date field for user acquisition
      and signup trend analysis.

  - name: country
    type: string
    description: >
      User country based on signup information.

      Used for:
      - geographic analysis
      - regional segmentation
      - revenue by region analysis
    alias: region
    group_by: true

  - name: device_type
    type: string
    description: >
      Device type used at signup.

      Used for:
      - platform analysis
      - user acquisition analysis
      - engagement analysis
    alias: platform
    group_by: true