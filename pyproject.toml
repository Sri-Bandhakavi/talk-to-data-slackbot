[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "talk-to-data-slackbot"
version = "0.1.0"
description = "Slack bot for natural-language analytics over PostgreSQL"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "pandasai>=3.0,<4",
    "pandasai-litellm>=0.0.1",
    "litellm==1.79.0",
    "pandasai-sql[postgres]>=0.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["talk_to_data_slackbot*"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a live PostgreSQL database",
]
testpaths = ["tests"]
