name: sessions
source:
  type: postgres
  connection:
    host: dpg-d35pib0dl3ps7394mc4g-a.oregon-postgres.render.com
    port: 5432
    database: beam_neb0
    user: students
    password: CohortApril2026
  table: sessions
description: 'User engagement and activity session dataset.

  Business rules and semantics: - Each row represents a user session. - session_date
  is the primary date field for engagement analysis. - duration_minutes represents
  total session duration. - session_hours represents session duration expressed in
  hours. - activity_type categorizes the session activity.

  Common business questions: - Total sessions - Average session duration - Average
  session hours - User engagement by activity type - User engagement trends over time

  This dataset is commonly joined to: - users via user_id - subscriptions through
  users


  Join context:

  user_id -> users.user_id'
columns:
- name: session_id
  type: integer
  description: Unique identifier for the session
- name: user_id
  type: integer
  description: 'Foreign key linking each session to a user record.

    '
- name: session_date
  type: datetime
  description: Date and time when the session occurred
- name: duration_minutes
  type: integer
  description: 'Duration of the session in minutes.

    Used for: - session length analysis - user engagement analysis - average session
    duration calculations

    '
- name: session_hours
  type: float
  description: 'Session duration expressed in hours.

    Used for: - average session hours calculations - engagement analysis - comparisons
    of user activity levels

    '
  expression: duration_minutes / 60.0
- name: activity_type
  type: string
  description: "Type of activity performed during the session.\nTypical values: -\
    \ browse - listen - read\nUsed for: - engagement analysis - activity distribution\
    \ analysis - user behavior analysis\n (groupable dimension)"
  alias: engagement_type
