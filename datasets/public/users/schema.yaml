    password: CohortApril2026
  table: users
description: 'User signup and acquisition dataset.

  Business rules and semantics: - Each row represents a unique user. - signup_date
  is the primary date field for signup trend analysis. - country represents the user''s
  signup region. - device_type represents the signup platform.

  Common business questions: - User signup trends - User growth over time - Users
  by region - Users by signup platform - Revenue by region - Revenue by signup platform

  This dataset is commonly joined to: - subscriptions via user_id - sessions via user_id'
columns:
- name: user_id
  type: integer
  description: Unique identifier for the user
- name: signup_date
  type: datetime
  description: 'Primary user acquisition and signup date.

    Date and time when the user signed up.

    Primary date field for user acquisition and signup trend analysis.

    '
- name: country
  type: string
  description: "User country based on signup information.\nUsed for: - geographic\
    \ analysis - regional segmentation - revenue by region analysis\n (groupable dimension)"
  alias: region
- name: device_type
  type: string
  description: "Device type used at signup.\nUsed for: - platform analysis - user\
    \ acquisition analysis - engagement analysis\n (groupable dimension)"
  alias: platform
