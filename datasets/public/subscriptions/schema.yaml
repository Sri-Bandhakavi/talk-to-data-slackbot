name: subscriptions
source:
  type: postgres
  connection:
    host: dpg-d35pib0dl3ps7394mc4g-a.oregon-postgres.render.com
    port: 5432
    database: beam_neb0
    user: students
    password: CohortApril2026
  table: subscriptions
description: 'Tracks user subscriptions and subscription lifecycle activity.

  Common business questions: - Subscription churn - Active subscriptions - Active
  subscribers - Subscription plan distribution - Average subscription length - Retention
  analysis - Revenue by subscription plan

  Subscription churn and expiration analysis use status and end_date. Retention and
  lifecycle analysis use subscription_length_days, start_date, and end_date. Active
  subscription: status=''active'' and end_date is null.

  Business rules and semantics: - Each row represents a subscription associated with
  a user. - start_date is the primary date field for subscription analysis. - end_date
  supports churn and expiration analysis. - status indicates active, canceled, or
  expired subscriptions.

  Business definitions: - Canceled subscription: status=''canceled'' - Expired subscription:
  status=''expired''

  This dataset is commonly joined to: - users via user_id - payments via subscription_id


  Join context:

  user_id -> users.user_id'
columns:
- name: subscription_id
  type: integer
  description: Unique identifier for the subscription
- name: user_id
  type: integer
  description: 'Foreign key linking a subscription to a user record.

    '
- name: plan
  type: string
  description: "Subscription plan.\nTypical values: - free - monthly - annual\nUsed\
    \ for: - subscription plan analysis - user segmentation - revenue analysis\n (groupable\
    \ dimension)"
  alias: subscription_plan
- name: start_date
  type: datetime
  description: 'Subscription start date for lifecycle and activation analysis.

    Date when the subscription started.

    Primary date field for subscription lifecycle analysis.

    '
- name: end_date
  type: datetime
  description: 'Subscription churn and expiration date.

    Date when the subscription ended.

    Used for: - churn analysis - expiration analysis - subscription lifecycle analysis

    Active subscriptions typically have a null end_date.

    '
- name: status
  type: string
  description: "Active subscriptions and current subscription status.\nCurrent subscription\
    \ status.\nValid values: - active - canceled - expired\nQuestions referring to:\
    \ - active subscriptions - active subscribers - currently subscribed users\nshould\
    \ use:\nstatus='active'\n (groupable dimension)"
  alias: subscription_status
- name: subscription_length_days
  type: integer
  description: 'Subscription length metric for retention, churn, and lifecycle analysis.

    Length of subscription in days.

    Calculated as:

    end_date - start_date

    For active subscriptions, the calculation uses the current date.

    Used for: - subscription lifecycle analysis - retention analysis - churn analysis
    - average subscription length calculations

    '
  expression: EXTRACT( DAY FROM ( COALESCE(end_date, CURRENT_DATE) - start_date )
    )
